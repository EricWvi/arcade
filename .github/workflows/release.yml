name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (e.g., 1.2.3)"
        required: true
        type: string

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${INPUT_VERSION#v}
          fi

          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # GHCR image names must be lowercase; the repository owner may not be.
      - name: Set image tags
        id: tags
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          IMAGE=ghcr.io/${REPO,,}
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${VERSION}"
            # Pre-releases such as 1.2.0-rc.1 never move latest.
            if [[ $VERSION != *-* ]]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v5

      # No QEMU: every build stage runs on the runner and Go cross-compiles,
      # and the runtime stage has no RUN steps.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The public site on 4399.onlyquant.top; see docs/cloudflare.md.
  worker:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      # Includes the API contract against the Go server.
      - name: Test the Worker
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npm test

      # Idempotent, so the first release needs nothing created by hand. D1
      # lives near the players; without a hint it lands near the runner.
      - name: Create D1 and R2 if missing
        working-directory: worker
        run: |
          npx wrangler d1 info arcade >/dev/null 2>&1 || npx wrangler d1 create arcade --location apac
          npx wrangler r2 bucket info arcade-games >/dev/null 2>&1 || npx wrangler r2 bucket create arcade-games

      - name: Migrate D1
        working-directory: worker
        run: npx wrangler d1 migrations apply arcade --remote

      # GitHub reserves the GITHUB_ prefix for its own secrets, hence OAUTH_.
      - name: Deploy
        working-directory: worker
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          secrets="$RUNNER_TEMP/worker-secrets.json"
          node -e 'console.log(JSON.stringify({
            GITHUB_CLIENT_ID: process.env.OAUTH_CLIENT_ID,
            GITHUB_CLIENT_SECRET: process.env.OAUTH_CLIENT_SECRET,
          }))' > "$secrets"
          npx wrangler deploy --var "VERSION:${VERSION}" --secrets-file "$secrets"
          rm -f "$secrets"
