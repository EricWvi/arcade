# The games the site offers and how the home page shows them. This file sits
# next to config.yaml; restart arcade after editing it.

# Home page rows, top to bottom. Each row lists game keys, left to right.
shelves:
  - id: nitrome
    title: Nitrome
    games: [hot-air-1]
  - id: zmxy
    title: 造梦西游系列
    games: [zmxy-1]

# Game key → details. The key is also the game's directory under games_dir:
# <games_dir>/<key>/imgs/{icon,card,poster,background}.png, each with a
# <kind>.blur.webp placeholder from `task images:placeholders`. `swf` is the
# movie to play, relative to <games_dir>/<key>/sources; files it loads, such
# as levels, sit beside it. Players need the Ruffle browser extension.
# `help` says how to play and is shown beside the game; line breaks are kept.
# `saves` is how the game keeps progress: shared-object (the default; Flash
# SharedObjects, synced automatically) or file (the game exports and imports
# save files, as 造梦西游 does; the page keeps them on the server).
games:
  hot-air-1:
    title: Hot Air
    subtitle: 休闲闯关
    swf: Hot_Air.swf
    help: |
      用鼠标指针在屏幕上移动风扇。
  zmxy-1:
    title: 造梦西游
    subtitle: 动作冒险
    swf: zmxy_1.swf
    saves: file
    help: |
      A / D 移动，J 攻击，K 跳跃，U / I / O / L / 空格 释放技能。
      双人模式下玩家二用方向键移动，小键盘 1 攻击、2 跳跃。
      在大地图点「保存游戏」存档，从「单人游戏 → 继续游戏」读档。
