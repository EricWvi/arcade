version: "3"

tasks:
  default:
    cmds:
      - task: list

  list:
    desc: List all tasks in the current project
    cmds:
      - task --list

  ###################################################
  ############## Install Dependencies ###############
  ###################################################

  install:frontend:
    desc: Install locked frontend dependencies (Node 24+)
    dir: frontend
    cmds:
      - npm ci

  install:worker:
    desc: Install locked Cloudflare Worker dependencies
    dir: worker
    cmds:
      - npm ci

  install:go:
    desc: Download Go module dependencies
    cmds:
      - go mod download

  install:images:
    desc: Create the Python venv (.tmp/venv) with Pillow for image tasks
    status:
      - test -x .tmp/venv/bin/python
      - .tmp/venv/bin/python -c "import PIL"
    cmds:
      - python3 -m venv .tmp/venv
      - .tmp/venv/bin/pip install --quiet pillow==12.3.0

  ###################################################
  ############## Clean and Build Tasks ##############
  ###################################################

  build:
    desc: Build the release binary with the frontend embedded (release/arcade)
    cmds:
      - ./scripts/build.sh

  build:frontend:
    desc: Build the frontend static dist
    dir: frontend
    cmds:
      - npm run build

  build:go:
    desc: Compile all Go packages
    cmds:
      - go build ./...

  clean:
    desc: Remove release binaries and the built frontend dist
    cmds:
      - rm -rf release
      - find frontend/dist -mindepth 1 ! -name .gitkeep -delete

  format:
    desc: Format all Go sources
    cmds:
      - task: format:go

  format:go:
    desc: Format Go sources with gofmt
    cmds:
      - gofmt -w cmd internal arcade.go

  lint:
    desc: Run all linters
    cmds:
      - task: lint:frontend
      - task: lint:worker
      - task: lint:go

  lint:frontend:
    desc: Typecheck frontend source
    dir: frontend
    cmds:
      - npm run typecheck

  lint:worker:
    desc: Typecheck the Cloudflare Worker
    dir: worker
    cmds:
      - npm run typecheck

  lint:go:
    desc: Check gofmt and run go vet
    silent: true
    cmds:
      - |
        unformatted=$(gofmt -l cmd internal arcade.go)
        if [ -n "$unformatted" ]; then
          echo "gofmt needed (run task format):"
          echo "$unformatted"
          exit 1
        fi
      - go vet ./...

  test:
    desc: Run all lint and unit tests
    cmds:
      - task: lint
      - task: test:go
      - task: test:worker

  test:go:
    desc: Run Go unit and HTTP tests
    cmds:
      - go test ./...

  test:worker:
    desc: Run the Cloudflare Worker tests and the API contract against both servers
    dir: worker
    cmds:
      - npm test

  test:contract:
    desc: Run only the API contract (worker/contract) against the Go server and the Worker
    dir: worker
    cmds:
      - npm test -- --project 'contract:*'

  images:placeholders:
    desc: "Write blurred <name>.blur.webp placeholders (default: games/*/imgs; or task images:placeholders -- PATH...)"
    deps: [install:images]
    cmds:
      - .tmp/venv/bin/python -I scripts/lqip.py {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}games/*/imgs{{end}}

  ###################################################
  ############# Run Development Servers #############
  ###################################################

  run:web:
    desc: Start the Vite frontend development server
    dir: frontend
    cmds:
      - npm run dev

  run:server:
    desc: Run the arcade server with .data/config.yaml; the database lives in .data too
    cmds:
      - go run ./cmd/arcade -config .data/config.yaml {{.CLI_ARGS}}

  run:worker:
    desc: "Run the Cloudflare Worker locally on :8787 (set DEV_USER in worker/.dev.vars to skip GitHub)"
    dir: worker
    cmds:
      - npx wrangler d1 migrations apply arcade --local
      - npx wrangler dev {{.CLI_ARGS}}

  ###################################################
  ##################### Deploy ######################
  ###################################################

  deploy:worker:
    desc: Build the frontend, migrate D1 and deploy the Cloudflare Worker (needs wrangler login)
    deps: [build:frontend]
    dir: worker
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
    cmds:
      - npx wrangler d1 migrations apply arcade --remote
      - npx wrangler deploy --var VERSION:{{.VERSION}}
